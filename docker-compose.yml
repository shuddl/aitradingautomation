version: "3.9"
services:
  redis:
    image: redis:7-alpine
    restart: always
  prometheus:
    image: prom/prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
  dashboard:
    build: .
    environment:
      - REDIS_HOST=redis
      - JWT_SECRET=dev
    ports: ["8000:8000"]
    depends_on: [redis, prometheus]
